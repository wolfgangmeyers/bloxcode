<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Roblox Block Coding Prototype</title>
    <link rel="stylesheet" href="./dark-filetree/style.css" />
    <link rel="stylesheet" href="./jquery.simplepopup.css" />
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <script src="./jquery-3.5.1.min.js"></script>
    <script src="./bootstrap.min.js"></script>
    <script src="./jstree.min.js"></script>
    <script src="./blockly_compressed.js"></script>
    <script src="./blocks_compressed.js"></script>
    <script src="./lua_compressed.js"></script>
    <script src="./jquery.simplepopup.js"></script>
    <script src="./en.js"></script>
    <script src="./toolbox.js"></script>
    <style>
        body {
            background-color: #181818;
            color: #fff !important;
            font-family: sans-serif;
        }

        h1 {
            font-weight: normal;
            font-size: 140%;
        }

        hr {
            border: 1px solid white;
        }

        button,
        .btn {
            background-color: #2B4764;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 5px;
        }

        button:hover,
        .btn:hover {
            background-color: #35587c;
        }

        button:disabled {
            background-color: #5f85aa;
        }

        #blocklyDiv {
            position: absolute;
        }

        #browser {
            position: absolute;
        }

        #breadcrumb {
            position: absolute;
            left: 310px;
            top: 145px;
            background-color: #252526;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 13px;
            color: #ccc;
            display: none;
            margin-bottom: 8px;
        }

        #breadcrumb .separator {
            margin: 0 8px;
            color: #666;
        }

        #breadcrumb .type {
            color: #4EC9B0;
            font-weight: 500;
        }

        #breadcrumb .name {
            color: #DCDCAA;
        }
    </style>
</head>

<body>
    <img src="bloxcode-logo-truncated.png"
        style="margin-bottom: 30px; margin-top: 10px; display: block; margin-left: auto; margin-right: auto" />

    <div id="controls" style="display: none">
        <button class="btn btn-sm" id="save-script-button" style="display: none" onclick="saveScript()">Save</button>
        <button class="btn btn-sm" id="delete-script-button" style="display: none" onclick="deleteScript()">Delete</button>
        <button class="btn btn-sm" id="new-local-script-button" onclick="newLocalScript()" style="display: none">New LocalScript</button>
        <button class="btn btn-sm" id="new-script-button" onclick="newScript()" style="display: none">New Script</button>

        <button class="btn btn-sm" onclick="refresh()">Refresh</button>
    </div>
    <hr />

    <div id="browser" style="width: 200px; height: 480px;">

    </div>
    <div id="breadcrumb"></div>
    <div id="blocklyDiv" style="left: 200px; height: 480px; width: 600px;"></div>
    <div id="noScriptMessage" style="display: none; position: absolute; left: 300px; top: 200px; text-align: center; width: calc(100% - 320px);">
        <h2 style="color: #888;">No Script Selected</h2>
        <p style="color: #666;">Select a Script or LocalScript from the tree on the left to start editing,<br>or create a new one by selecting a container object.</p>
    </div>


    <script type="text/javascript">
        const onResize = () => {
            const div = document.getElementById("blocklyDiv")
            const breadcrumb = document.getElementById("breadcrumb")
            const isVisible = div.style.display !== 'none'
            div.style = `left: 310px; width: ${window.innerWidth - 320}px; height: ${window.innerHeight - 220}px; top: 185px; ${isVisible ? '' : 'display: none;'}`
            breadcrumb.style.width = `${window.innerWidth - 330}px`
        }
        window.addEventListener("resize", onResize);
        onResize()
    </script>
    <script>
        var demoWorkspace = Blockly.inject('blocklyDiv', {
            media: '../../media/',
            toolbox: bloxcode_toolbox,
        });
        var theme = Blockly.Theme.defineTheme('dark', {
            'base': Blockly.Themes.Classic,
            'componentStyles': {
                'workspaceBackgroundColour': '#1e1e1e',
                'toolboxBackgroundColour': 'blackBackground',
                'toolboxForegroundColour': '#fff',
                'flyoutBackgroundColour': '#252526',
                'flyoutForegroundColour': '#ccc',
                'flyoutOpacity': 1,
                'scrollbarColour': '#797979',
                'insertionMarkerColour': '#fff',
                'insertionMarkerOpacity': 0.3,
                'scrollbarOpacity': 0.4,
                'cursorColour': '#d0d0d0',
                'blackBackground': '#333',
            },
        });
        demoWorkspace.setTheme(theme)

    </script>
    <script src="blocks.js"></script>
    <script src="sync.js"></script>
    <script>
            (function ($) {
                $("#browser").jstree({
                    core: {
                        "themes": {
                            "stripes": true
                        },
                        data: []
                    },
                }).on("activate_node.jstree", function (evt, node) {
                    const nodeData = node.node.original
                    updateSelectedNode(nodeData)
                })
            }(jQuery))
    </script>
    
</body>

</html>
